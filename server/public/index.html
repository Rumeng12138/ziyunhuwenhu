  /* ============================================================
     紫云湖文房商城 - 部署配置
     ============================================================
     部署方式一：同源部署（推荐）
     将本 index.html 放入后端 server/public/ 目录，由 Express 托管
     此时 API_BASE_URL 改为：const API_BASE_URL = '/api';

     部署方式二：分离部署
     本文件独立静态托管（Nginx/CDN），后端单独运行
     此时 API_BASE_URL 改为后端实际地址，如：
     const API_BASE_URL = 'https://api.your-domain.invalid/api';

     管理后台访问地址：http://后端域名/admin
     默认管理员账号：admin / admin123
     ============================================================ */
  const API_BASE_URL = '/api';
  const TOKEN_KEY = 'zyh_token';

  /**
   * 统一请求封装
   * - 自动注入 Authorization: Bearer <token>
   * - 响应 JSON 解析，code === 200 视为成功，返回 data
   * - code === 401 自动清除 token 并触发回调（由 store 弹登录框）
   */
  const API = {
    _on401: null, // 由 StoreProvider 注入

    async request(url, { method = 'GET', body, headers = {}, raw = false } = {}) {
      const token = LS.get(TOKEN_KEY, '');
      const finalHeaders = {
        'Content-Type': 'application/json',
        ...headers,
      };
      if (token) finalHeaders['Authorization'] = 'Bearer ' + token;

      try {
        const resp = await fetch(API_BASE_URL + url, {
          method,
          headers: finalHeaders,
          body: body !== undefined ? JSON.stringify(body) : undefined,
        });
        if (raw) return resp;
        const contentType = resp.headers.get('content-type') || '';
        const responseText = await resp.text();
        if (!contentType.includes('application/json')) {
          throw new Error('服务响应格式异常，请确认后端服务与页面版本一致');
        }
        let json;
        try { json = responseText ? JSON.parse(responseText) : {}; }
        catch { throw new Error('服务响应数据格式错误，请稍后重试'); }
        // 401 自动清除 token
        if (json.code === 401) {
          LS.remove(TOKEN_KEY);
          if (typeof this._on401 === 'function') this._on401();
          throw new Error(json.message || '登录已过期，请重新登录');
        }
        if (json.code !== 200) {
          throw new Error(json.message || '请求失败');
        }
        return json.data !== undefined ? json.data : json;
      } catch (e) {
        // 网络错误
        if (e.name === 'TypeError' || /Failed to fetch|NetworkError/.test(e.message)) {
          throw new Error('网络连接失败，请检查后端服务是否启动');
        }
        throw e;
      }
    },

    get:    (url, opts)           => API.request(url, { ...opts, method: 'GET' }),
    post:   (url, body, opts)     => API.request(url, { ...opts, method: 'POST', body }),
    put:    (url, body, opts)     => API.request(url, { ...opts, method: 'PUT', body }),
    del:    (url, opts)           => API.request(url, { ...opts, method: 'DELETE' }),
  };

  // 后台保存单规格商品，统一转换为卡片、详情和加购使用的数据结构。
  function normalizeProduct(product) {
    const categoryLabels = { pen: '毛笔', brush: '毛笔', ink: '墨品', paper: '宣纸', inkstone: '砚台', other: '其他' };
    const specs = Array.isArray(product.specs) && product.specs.length > 0
      ? product.specs
      : [{ label: product.spec || '默认规格', price: Number(product.price) || 0, stock: Number(product.stock) || 0 }];
    const image = product.image || '';
    return {
      ...product,
      specs,
      catLabel: product.catLabel || product.category_name_zh || categoryLabels[product.category] || product.category,
      subcatLabel: product.subcatLabel || product.subcategory_name_zh || '',
      desc: product.desc || product.description || '',
      // 上传图片属于后端域名，分离部署时也不能指向静态页面域名。
      image: image ? new URL(image, new URL(API_BASE_URL, window.location.href).origin + '/').href : '',
    };
  }


  function normalizeLine(item) {
    return { ...item, productId: item.product_id ?? item.productId, name: item.product_name ?? item.name ?? '商品',
      price: Number(item.price) || 0, qty: Number(item.quantity ?? item.qty) || 0,
      specLabel: item.spec ?? item.specLabel ?? '', stock: Number(item.stock) || 0,
      image: item.image ? new URL(item.image, new URL(API_BASE_URL, window.location.href).origin + '/').href : '' };
  }
  function normalizeOrder(order) {
    return { ...order, orderId: order.id, orderNo: order.order_no ?? order.orderNo ?? String(order.id),
      payAmount: Number(order.total_amount ?? order.payAmount) || 0, freight: Number(order.freight) || 0,
      createdAt: order.created_at ?? order.createdAt, paidAt: order.paid_at ?? order.paidAt,
      items: (order.items || []).map(normalizeLine),
      address: { name: order.receiver_name || '', phone: order.receiver_phone || '', country: order.receiver_country || '中国', province: order.receiver_province || '', city: order.receiver_city || '', district: order.receiver_district || '', detail: order.receiver_address || '' } };
  }

  const formatPrice = (n) => '¥ ' + (Number.isFinite(Number(n)) ? Number(n) : 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const formatShortPrice = (n) => formatPrice(n);

  const genOrderId = () => {
    const d = new Date();
    const pad = (x) => String(x).padStart(2, '0');
    return 'ZYH' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + Math.floor(Math.random()*1000).toString().padStart(3,'0');
  };

  const formatDate = (d) => {
    const pad = (x) => String(x).padStart(2, '0');
    const dt = new Date(typeof d === 'string' ? d.replace(' ', 'T') : d);
    if (!d || !Number.isFinite(dt.getTime())) return '—';
    return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
  };

        setLoading(true);

          if (!cancelled) setDetailData(normalizeProduct({

  function LoginModal({ open, onClose }) {
    const { login, register } = useStore();
    const [mode, setMode] = useState('login'); // login | register
    const [username, setUsername] = useState('');
    const [password, setPassword] = useState('');
    const [confirmPwd, setConfirmPwd] = useState('');
    const [error, setError] = useState('');
    const [success, setSuccess] = useState('');
    const [loading, setLoading] = useState(false);

    useEffect(() => {
      if (open) {
        setMode('login');
        setUsername(''); setPassword(''); setConfirmPwd('');
        setError(''); setSuccess('');
      }
    }, [open]);

    const handleSubmit = async (e) => {
      e.preventDefault();
      setError(''); setSuccess('');
      if (!username.trim()) { setError('请输入用户名'); return; }
      if (username.length < 3) { setError('用户名至少3个字符'); return; }
      if (!password) { setError('请输入密码'); return; }
      if (password.length < 6) { setError('密码至少6位'); return; }
      setLoading(true);
      try {

  // ========== 滚动显现动画 ==========
  function useReveal() {
    useEffect(() => {
      const ob = new IntersectionObserver(
        entries => {
          entries.forEach(e => {
            if (e.isIntersecting) {
              e.target.classList.add('visible');
              ob.unobserve(e.target);
            }
          });
        },
        { threshold: 0.1, rootMargin: '0px 0px -40px 0px' }
      );
      const observeReveals = (root) => {
        if (root.nodeType !== 1) return;
        if (root.matches('.reveal:not(.visible)')) ob.observe(root);
        root.querySelectorAll('.reveal:not(.visible)').forEach(el => ob.observe(el));
      };
      observeReveals(document.documentElement);
      // 商品请求完成、切换分类后插入的卡片也需要注册显现动画。
      const changes = new MutationObserver(records => {
        records.forEach(record => record.addedNodes.forEach(observeReveals));
      });
      changes.observe(document.getElementById('root'), { childList: true, subtree: true });
      return () => { changes.disconnect(); ob.disconnect(); };
    }, []);
  }
