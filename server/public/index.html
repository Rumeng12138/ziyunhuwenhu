  <style>
    /* ========== 设计令牌 ========== */
    :root {
      --ziyun-deep: #4a3570;
      --ziyun-main: #6B4E91;
      --ziyun-light: #8a70b0;
      --ziyun-pale: #e8dff5;
      --ziyun-50: #f5f0fb;

      --ink-black: #1A1A1A;
      --ink-deep: #2a2724;
      --ink-medium: #4a4540;
      --ink-light: #7a746d;

      --paper-cream: #F8F5ED;
      --paper-warm: #faf8f2;
      --paper-white: #fdfcf8;

      --gold: #C8A464;
      --gold-light: #dcc08a;
      --gold-dark: #a8824a;

      --vermilion: #9c2a28;
      --vermilion-light: #be3e3b;

      --bamboo: #3d5c42;

      --border-subtle: rgba(26, 26, 26, 0.08);
      --border-medium: rgba(26, 26, 26, 0.14);

      --shadow-sm: 0 1px 3px rgba(26, 26, 26, 0.06), 0 1px 2px rgba(26, 26, 26, 0.04);
      --shadow-md: 0 4px 14px rgba(26, 26, 26, 0.08), 0 2px 6px rgba(26, 26, 26, 0.05);
      --shadow-lg: 0 12px 36px rgba(26, 26, 26, 0.14), 0 4px 12px rgba(26, 26, 26, 0.08);
      --shadow-xl: 0 28px 72px rgba(26, 26, 26, 0.22), 0 8px 24px rgba(26, 26, 26, 0.1);

      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

      --max-width: 1280px;
      --nav-height: 72px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth; -webkit-font-smoothing: antialiased;
      scroll-padding-top: calc(var(--nav-height) + 12px);
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink-deep);
      background-color: var(--paper-warm);
      overflow-x: hidden; min-width: 0;
    }

    /* 宣纸纹理 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='matrix' values='1 0 0 0 0.88 0 1 0 0 0.84 0 0 1 0 0.76 0 0 0 0.08 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.6;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Noto Serif SC', 'Songti SC', serif;
      font-weight: 600;
      line-height: 1.35;
      color: var(--ink-black);
      letter-spacing: 0.02em;
    }

    a { color: inherit; text-decoration: none; transition: color 0.3s var(--ease-out); }
    img { max-width: 100%; display: block; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    button, a, [role="button"] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    ul { list-style: none; }

    .calligraphy {
      font-family: 'Ma Shan Zheng', 'Noto Serif SC', cursive;
      font-weight: normal;
      letter-spacing: 0.05em;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 40px;
      position: relative;
      z-index: 1;
    }

    .section { padding: 100px 0; position: relative; }

    .section-header { text-align: center; margin-bottom: 56px; }
    .section-eyebrow {
      display: inline-flex; align-items: center; gap: 12px;
      font-size: 12px; color: var(--ziyun-main); letter-spacing: 0.25em;
      margin-bottom: 14px;
    }
    .section-eyebrow::before, .section-eyebrow::after {
      content: ''; width: 32px; height: 1px; background-color: var(--ziyun-light); opacity: 0.5;
    }
    .section-title { font-size: 36px; font-weight: 700; margin-bottom: 10px; }
    .section-subtitle { font-size: 15px; color: var(--ink-light); max-width: 520px; margin: 0 auto; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 30px; font-size: 14px; font-weight: 500;
      border-radius: 2px; transition: all 0.35s var(--ease-out);
      cursor: pointer; letter-spacing: 0.05em; position: relative;
      white-space: nowrap;
    }
    .btn-primary { background: var(--ink-black); color: var(--paper-cream); }
    .btn-primary:hover { background: var(--ziyun-main); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(107, 78, 145, 0.28); }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 60%, var(--gold-light) 100%);
      color: var(--ink-black); font-weight: 600;
    }
    .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(200, 164, 100, 0.4); }
    .btn-outline { background: transparent; color: var(--ink-black); border: 1px solid var(--border-medium); }
    .btn-outline:hover { background: var(--ink-black); color: var(--paper-cream); border-color: var(--ink-black); }
    .btn-block { width: 100%; }
    .btn-sm { padding: 8px 18px; font-size: 13px; }
    .btn[disabled] { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    .reveal { opacity: 0; transform: translateY(28px); transition: all 0.8s var(--ease-out); }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(32px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(32px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========== Header ========== */
    .header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: var(--nav-height); display: flex; align-items: center;
      transition: all 0.4s var(--ease-out);
      background: rgba(250, 248, 242, 0.85);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid transparent;
    }
    .header.scrolled {
      background: rgba(250, 248, 242, 0.96);
      border-bottom-color: var(--border-subtle);
      box-shadow: var(--shadow-sm);
    }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between; gap: 28px; width: 100%;
    }
    .header .container { width: 100%; max-width: 1440px; padding: 0 32px; }
    .logo { display: flex; flex: 0 0 auto; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
    .logo-mark {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--ziyun-deep) 0%, var(--ziyun-main) 100%);
      border-radius: 3px; display: flex; align-items: center; justify-content: center;
      color: var(--paper-cream); font-family: 'Ma Shan Zheng', cursive; font-size: 22px;
      position: relative;
    }
    .logo-mark::after {
      content: ''; position: absolute; inset: 3px;
      border: 1px solid rgba(248, 245, 237, 0.3); border-radius: 2px;
    }
    .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
    .logo-name {
      font-family: 'Noto Serif SC', serif; font-size: 20px; font-weight: 700;
      color: var(--ink-black); letter-spacing: 0.1em;
    }
    .logo-tag { font-size: 10px; color: var(--ink-light); letter-spacing: 0.15em; margin-top: 2px; }

    .header nav { flex: 1 1 auto; min-width: 0; }
    .nav-menu { display: flex; align-items: center; justify-content: center; gap: clamp(18px, 2vw, 32px); list-style: none; white-space: nowrap; }
    .nav-link {
      font-size: 14px; font-weight: 500; color: var(--ink-medium);
      position: relative; padding: 6px 0; transition: color 0.3s var(--ease-out); cursor: pointer;
    }
    .nav-link::after {
      content: ''; position: absolute; bottom: 0; left: 50%;
      width: 0; height: 2px; background: var(--ziyun-main);
      transition: all 0.3s var(--ease-out); transform: translateX(-50%);
    }
    .nav-link:hover { color: var(--ink-black); }
    .nav-link:hover::after { width: 100%; }

    .nav-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 8px; }
    .language-switch {
      min-width: 48px; height: 34px; padding: 0 12px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--border-medium); border-radius: 18px;
      color: var(--ink-medium); background: rgba(253, 252, 248, 0.72);
      font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
      transition: all 0.25s var(--ease-out);
    }
    .language-switch:hover, .language-switch:focus-visible {
      color: var(--ziyun-main); border-color: var(--ziyun-light);
      background: var(--ziyun-50); outline: none;
    }
    .nav-icon-btn {
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; color: var(--ink-medium); transition: all 0.3s var(--ease-out);
      position: relative;
    }
    .nav-icon-btn:hover { background: rgba(107, 78, 145, 0.08); color: var(--ziyun-main); }
    .cart-badge {
      position: absolute; top: 4px; right: 2px;
      min-width: 18px; height: 18px; padding: 0 4px;
      background: var(--vermilion); color: var(--paper-cream);
      font-size: 11px; font-weight: 600; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      animation: scaleIn 0.3s var(--ease-spring);
    }
    .nav-user {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 20px; cursor: pointer;
      font-size: 13px; color: var(--ink-medium);
      transition: all 0.3s var(--ease-out);
    }
    .nav-user:hover { background: rgba(107, 78, 145, 0.08); color: var(--ziyun-main); }
    .nav-user-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, var(--ziyun-main), var(--gold));
      color: white; font-size: 12px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-login-btn {
      padding: 6px 18px; font-size: 13px; border-radius: 20px;
      border: 1px solid var(--border-medium); color: var(--ink-medium);
      transition: all 0.3s var(--ease-out); cursor: pointer;
    }
    .nav-login-btn:hover { border-color: var(--ziyun-main); color: var(--ziyun-main); background: var(--ziyun-50); }

    .mobile-menu-btn { display: none; flex-direction: column; gap: 5px; cursor: pointer; width: 40px; height: 40px; align-items: center; justify-content: center; }
    .mobile-menu-btn span { display: block; width: 22px; height: 2px; background: var(--ink-black); transition: all 0.3s var(--ease-out); }
    .mobile-menu-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .mobile-menu-btn.open span:nth-child(2) { opacity: 0; }
    .mobile-menu-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .mobile-menu {
      position: fixed; top: var(--nav-height); left: 0; right: 0; bottom: 0;
      background: rgba(250, 248, 242, 0.98); backdrop-filter: blur(20px);
      z-index: 999; padding: 28px 24px;
      transform: translateX(100%);
      transition: transform 0.4s var(--ease-out), visibility 0s linear 0.4s;
      display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
      visibility: hidden; pointer-events: none;
      overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    }
    .mobile-menu.open { transform: translateX(0); visibility: visible; pointer-events: auto; transition-delay: 0s; }
    .mobile-menu-item {
      padding: 16px 0; font-size: 17px; font-family: 'Noto Serif SC', serif;
      font-weight: 500; color: var(--ink-black); border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
    }
    .mobile-user {
      padding: 20px 0; border-bottom: 1px solid var(--border-subtle); margin-bottom: 8px;
    }

    /* ========== 搜索栏 ========== */
    .search-bar {
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--paper-white); border-bottom: 1px solid var(--border-subtle);
      padding: 12px 0;
      transform: translateY(-10px); opacity: 0; pointer-events: none;
      transition: all 0.3s var(--ease-out);
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .search-bar.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .search-bar-inner {
      display: flex; align-items: center; gap: 12px;
      max-width: 600px; margin: 0 auto;
    }
    .search-input-wrap {
      flex: 1; position: relative;
      display: flex; align-items: center;
    }
    .search-input-wrap .search-icon-left {
      position: absolute; left: 14px; color: var(--ink-light);
    }
    .search-input {
      width: 100%; padding: 10px 40px 10px 42px;
      border: 1px solid var(--border-medium); border-radius: 24px;
      font-size: 14px; color: var(--ink-black); background: var(--paper-cream);
      transition: all 0.25s; outline: none;
    }
    .search-input:focus { border-color: var(--ziyun-main); background: var(--paper-white); box-shadow: 0 0 0 3px rgba(107,78,145,0.08); }
    .search-clear-btn {
      position: absolute; right: 12px;
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--border-medium); color: var(--paper-white);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .search-clear-btn:hover { background: var(--ink-medium); }
    .search-close-btn {
      padding: 8px 16px; font-size: 13px; color: var(--ink-medium); cursor: pointer;
      transition: color 0.2s; white-space: nowrap;
    }
    .search-close-btn:hover { color: var(--ziyun-main); }
    .search-result-info {
      max-width: 600px; margin: 8px auto 0;
      font-size: 12px; color: var(--ink-light);
      display: flex; justify-content: space-between; align-items: center;
    }
    .search-result-info .clear-search {
      color: var(--ziyun-main); cursor: pointer;
    }
    .search-empty {
      text-align: center; padding: 60px 20px; color: var(--ink-light);
    }
    .search-empty strong { display: block; font-size: 15px; color: var(--ink-medium); margin-bottom: 6px; }

    /* ========== Hero ========== */
    .hero {
      position: relative; min-height: 92vh; display: flex; align-items: center;
      padding-top: var(--nav-height); overflow: hidden;
      background: var(--paper-warm);
    }
    .hero-bg { position: absolute; inset: 0; z-index: 0; }
    .hero-bg img {
      width: 100%; height: 100%; object-fit: cover; object-position: center;
      animation: kenBurns 24s ease-in-out infinite alternate;
    }
    @keyframes kenBurns {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }
    .hero-overlay {
      position: absolute; inset: 0; z-index: 1;
      background:
        linear-gradient(135deg, rgba(26, 26, 26, 0.72) 0%, rgba(74, 53, 112, 0.45) 40%, rgba(248, 245, 237, 0.08) 70%, transparent 100%),
        linear-gradient(0deg, rgba(26, 26, 26, 0.3) 0%, transparent 40%);
    }
    .hero-content {
      position: relative; z-index: 2; max-width: 600px; color: var(--paper-cream);
      padding: 60px 0;
    }
    .hero.editorial-layout-centered .hero-content { margin: 0 auto; text-align: center; }
    .hero.editorial-layout-centered .hero-desc { margin-left: auto; margin-right: auto; }
    .hero.editorial-layout-centered .hero-actions { justify-content: center; }
    .hero.editorial-layout-split .hero-content { max-width: 760px; }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 12px;
      font-size: 13px; letter-spacing: 0.3em; margin-bottom: 24px;
      opacity: 0.85; animation: fadeInUp 0.8s var(--ease-out) 0.2s both;
    }
    .hero-eyebrow::before { content: ''; width: 40px; height: 1px; background: var(--gold); }
    .hero-title {
      font-size: 20px; font-weight: 400; letter-spacing: 0.5em;
      margin-bottom: 16px; color: var(--gold-light);
      animation: fadeInUp 0.8s var(--ease-out) 0.3s both;
    }
    .hero-brand {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 110px; font-weight: normal; line-height: 1;
      color: var(--paper-cream); margin-bottom: 20px;
      text-shadow: 0 4px 30px rgba(0,0,0,0.3);
      animation: fadeInUp 0.9s var(--ease-out) 0.4s both;
    }
    .hero-slogan {
      font-family: 'Noto Serif SC', serif;
      font-size: 26px; font-weight: 500; margin-bottom: 16px;
      color: var(--paper-white); letter-spacing: 0.15em;
      animation: fadeInUp 0.8s var(--ease-out) 0.6s both;
    }
    .hero-desc {
      font-size: 15px; line-height: 1.9; opacity: 0.8;
      max-width: 460px; margin-bottom: 36px;
      animation: fadeInUp 0.8s var(--ease-out) 0.75s both;
    }
    .hero-actions {
      display: flex; gap: 14px;
      animation: fadeInUp 0.8s var(--ease-out) 0.9s both;
    }
    .hero-scroll {
      position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
      z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 10px;
      color: var(--paper-cream); font-size: 11px; letter-spacing: 0.25em; opacity: 0.7;
      animation: fadeIn 1s ease 1.5s both;
    }
    .scroll-line {
      width: 1px; height: 44px; background: linear-gradient(to bottom, var(--paper-cream), transparent);
      position: relative; overflow: hidden;
    }
    .scroll-line::after {
      content: ''; position: absolute; top: -50%; left: 0; width: 100%; height: 40%;
      background: var(--gold); animation: scrollDown 2.5s ease-in-out infinite;
    }
    @keyframes scrollDown { 0% { top: -40%; } 100% { top: 100%; } }

    /* ========== 品类快捷入口 ========== */
    .cat-preview { padding: 72px 0; background: var(--paper-warm); }
    .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .cat-card {
      position: relative; aspect-ratio: 1 / 1;
      border-radius: 4px; overflow: hidden; cursor: pointer;
      background: var(--ink-medium);
    }
    .cat-card img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.7s var(--ease-out);
    }
    .cat-card:hover img { transform: scale(1.1); }
    .cat-card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(26,26,26,0) 35%, rgba(26,26,26,0.82) 100%);
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 24px; transition: background 0.4s var(--ease-out);
    }
    .cat-card:hover .cat-card-overlay {
      background: linear-gradient(180deg, rgba(107,78,145,0.2) 0%, rgba(26,26,26,0.88) 100%);
    }
    .cat-char {
      font-family: 'Noto Serif SC', serif;
      font-size: 44px; font-weight: 700; color: var(--paper-cream); line-height: 1;
      margin-bottom: 6px;
    }
    .cat-name { font-size: 14px; color: var(--gold); letter-spacing: 0.2em; margin-bottom: 4px; }
    .cat-desc { font-size: 12px; color: rgba(248,245,237,0.7); line-height: 1.6; }
    .cat-arrow {
      position: absolute; top: 20px; right: 20px;
      width: 34px; height: 34px; border: 1px solid rgba(248,245,237,0.4);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: var(--paper-cream); opacity: 0; transform: translateY(-6px);
      transition: all 0.4s var(--ease-out); backdrop-filter: blur(4px);
    }
    .cat-card:hover .cat-arrow { opacity: 1; transform: translateY(0); }

    /* ========== 商品列表 ========== */
    .products-section { padding: 90px 0; background: var(--paper-cream); }
    .products-section.standalone { padding-top: 140px; min-height: calc(100vh - 320px); }
    .editorial-body { max-width: 760px; margin: -24px auto 48px; color: var(--ink-medium); }
    .editorial-body p { margin-top: 12px; white-space: pre-wrap; }
    .editorial-layout-left .section-header { text-align: left; }
    .editorial-layout-left .section-subtitle,.editorial-layout-left .editorial-body { margin-left: 0; margin-right: 0; }
    .editorial-layout-split .section-header { display: grid; grid-template-columns: minmax(220px,0.8fr) minmax(280px,1.2fr); align-items: end; gap: 56px; text-align: left; }
    .editorial-layout-split .section-header .section-eyebrow { grid-column: 1; }
    .editorial-layout-split .section-header .section-title { grid-column: 1; }
    .editorial-layout-split .section-header .section-subtitle { grid-column: 2; grid-row: 1 / span 2; max-width: none; margin: 0; }
    @media (max-width: 760px) { .editorial-layout-split .section-header { display: block; text-align: center; } .editorial-layout-split .section-header .section-subtitle { margin: 0 auto; } }
    .product-catalog-layout {
      display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 36px; align-items: start;
    }
    .product-category-sidebar {
      position: sticky; top: calc(var(--nav-height) + 22px);
      padding: 18px; background: rgba(255,255,255,0.72);
      border: 1px solid var(--border-light); border-radius: 6px;
      box-shadow: var(--shadow-sm);
    }
    .product-category-title {
      margin: 0 0 12px; padding: 0 4px 12px; border-bottom: 1px solid var(--border-light);
      font-family: 'Noto Serif SC', serif; font-size: 15px; color: var(--ink-black); letter-spacing: 0.12em;
    }
    .catalog-category-button, .catalog-subcategory-button {
      width: 100%; border: 0; background: transparent; cursor: pointer; text-align: left;
      color: var(--ink-medium); transition: color 0.25s ease, background 0.25s ease;
    }
    .catalog-category-button {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      min-height: 42px; padding: 9px 10px; border-radius: 3px;
      font-family: 'Noto Serif SC', serif; font-size: 14px; font-weight: 600;
    }
    .catalog-category-button:hover, .catalog-category-button.active,
    .catalog-subcategory-button:hover, .catalog-subcategory-button.active {
      color: var(--ziyun-main); background: rgba(107,78,145,0.08);
    }
    .catalog-category-button.active { box-shadow: inset 3px 0 0 var(--ziyun-main); }
    .catalog-category-count { font-family: sans-serif; font-size: 11px; color: var(--ink-light); }
    .catalog-subcategory-list { padding: 1px 0 7px 14px; }
    .catalog-subcategory-button {
      display: flex; justify-content: space-between; gap: 8px; padding: 7px 9px;
      border-left: 1px solid var(--border-medium); font-size: 12px; line-height: 1.35;
    }
    .catalog-subcategory-button.active { border-left-color: var(--ziyun-main); font-weight: 600; }
    .product-catalog-results { min-width: 0; }
    .product-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
    }
    .category-load-notice { margin: 0 0 18px; color: var(--ink-light); font-size: 13px; }
    .view-all-products { display: flex; justify-content: center; margin-top: 40px; }
    .product-card {
      background: var(--paper-white); border-radius: 4px; overflow: hidden;
      box-shadow: var(--shadow-sm); transition: all 0.4s var(--ease-out);
      cursor: pointer; border: 1px solid var(--border-subtle);
      display: flex; flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-xl);
      border-color: rgba(107, 78, 145, 0.2);
    }
    .product-image {
      position: relative; aspect-ratio: 1 / 1; overflow: hidden;
      background: var(--paper-cream);
    }
    .product-image img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.6s var(--ease-out);
    }
    .product-card:hover .product-image img { transform: scale(1.07); }
    .product-tag {
      position: absolute; top: 12px; left: 12px;
      padding: 3px 10px; font-size: 11px; font-weight: 500;
      background: rgba(156, 42, 40, 0.95); color: var(--paper-cream);
      border-radius: 2px; letter-spacing: 0.05em;
    }
    .product-tag.new { background: rgba(61, 92, 66, 0.95); }
    .product-tag.classic { background: rgba(107, 78, 145, 0.95); }
    .product-info {
      padding: 18px; flex: 1; display: flex; flex-direction: column;
    }
    .product-cat { font-size: 11px; color: var(--ziyun-main); letter-spacing: 0.1em; margin-bottom: 6px; }
    .product-name {
      font-family: 'Noto Serif SC', serif; font-size: 16px; font-weight: 600;
      color: var(--ink-black); margin-bottom: 6px; line-height: 1.4;
    }
    .product-spec {
      font-size: 12px; color: var(--ink-light); margin-bottom: 12px;
      line-height: 1.6;
    }
    .product-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border-subtle);
    }
    .product-price {
      font-family: 'Noto Serif SC', serif;
      font-size: 20px; font-weight: 700; color: var(--vermilion);
    }
    .product-price small { font-size: 12px; font-weight: 400; color: var(--ink-light); margin-left: 2px; }
    .product-stock {
      font-size: 12px; color: var(--ink-light); margin-bottom: 8px;
    }
    .add-cart-btn {
      padding: 6px 14px; font-size: 12px; font-weight: 500;
      background: var(--ink-black); color: var(--paper-cream);
      border-radius: 2px; cursor: pointer; transition: all 0.3s var(--ease-out);
      display: flex; align-items: center; gap: 4px;
    }
    .add-cart-btn:hover { background: var(--ziyun-main); }

    /* ========== 品牌故事（深色） ========== */
    .story-section {
      padding: 100px 0; background: var(--ink-black); color: var(--paper-cream);
      position: relative; overflow: hidden;
    }
    .story-section::before {
      content: ''; position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='matrix' values='1 0 0 0 0.45 0 1 0 0 0.35 0 0 1 0 0.6 0 0 0 0.05 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.5; pointer-events: none;
    }
    .story-section .section-eyebrow { color: var(--gold); }
    .story-section .section-eyebrow::before,
    .story-section .section-eyebrow::after { background: var(--gold); opacity: 0.4; }
    .story-section .section-title { color: var(--paper-cream); }
    .story-section .section-subtitle { color: rgba(248,245,237,0.55); }
    .story-section .editorial-body { color: rgba(248,245,237,0.72); }

    .story-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-top: 56px; }
    .story-item {
      text-align: center; padding: 36px 24px;
      border: 1px solid rgba(248,245,237,0.12); border-radius: 4px;
      transition: all 0.4s var(--ease-out); background: rgba(248,245,237,0.02);
    }
    .story-item:hover {
      border-color: var(--gold); background: rgba(200,164,100,0.06);
      transform: translateY(-4px);
    }
    .story-num {
      font-family: 'Noto Serif SC', serif; font-size: 56px; font-weight: 300;
      color: var(--gold); line-height: 1; margin-bottom: 18px; opacity: 0.7;
    }
    .story-item-title {
      font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 600;
      color: var(--paper-cream); margin-bottom: 14px;
    }
    .story-item-desc {
      font-size: 14px; line-height: 1.9; color: rgba(248,245,237,0.6);
    }

    /* ========== 文房学堂 ========== */
    .culture-section { padding: 100px 0; background: var(--paper-warm); }
    .culture-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
    .culture-card {
      background: var(--paper-white); border-radius: 4px; overflow: hidden;
      box-shadow: var(--shadow-sm); transition: all 0.4s var(--ease-out);
      border: 1px solid var(--border-subtle); cursor: pointer;
    }
    .culture-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
    .culture-image { position: relative; aspect-ratio: 16 / 10; overflow: hidden; }
    .culture-image img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.6s var(--ease-out);
    }
    .culture-card:hover .culture-image img { transform: scale(1.06); }
    .culture-cat {
      position: absolute; bottom: 0; left: 0;
      padding: 5px 14px; background: var(--ziyun-main);
      color: var(--paper-cream); font-size: 12px; letter-spacing: 0.1em;
    }
    .culture-content { padding: 24px; }
    .culture-title {
      font-family: 'Noto Serif SC', serif; font-size: 19px; font-weight: 600;
      color: var(--ink-black); margin-bottom: 10px; line-height: 1.5;
    }
    .culture-desc {
      font-size: 13px; color: var(--ink-light); line-height: 1.8; margin-bottom: 18px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .culture-meta {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 14px; border-top: 1px solid var(--border-subtle);
      font-size: 12px; color: var(--ink-light);
    }
    .culture-read {
      color: var(--ziyun-main); display: flex; align-items: center; gap: 4px; font-weight: 500;
      border: 0; padding: 4px 0; background: transparent; cursor: pointer; font-family: inherit;
    }
    .culture-read:hover { color: var(--ziyun-deep); }
    .culture-card:focus-visible, .culture-read:focus-visible { outline: 2px solid var(--ziyun-main); outline-offset: 3px; }
    .culture-article-cover { width: 100%; aspect-ratio: 16 / 6; object-fit: cover; border-radius: 4px; margin-bottom: 20px; }
    .culture-article-meta { display: flex; flex-wrap: wrap; gap: 10px 18px; color: var(--ink-light); font-size: 13px; margin-bottom: 20px; }
    .culture-article-lead { font-size: 15px; line-height: 2; color: var(--ink-mid); padding: 18px 20px; background: var(--paper-white); border-left: 3px solid var(--ziyun-main); margin-bottom: 24px; }
    .culture-article-section { margin-top: 24px; }
    .culture-article-section h3 { font-family: 'Noto Serif SC', serif; font-size: 19px; color: var(--ink-black); margin-bottom: 10px; }
    .culture-article-section p { font-size: 14px; line-height: 2; color: var(--ink-mid); margin-bottom: 10px; }

    /* ========== Footer ========== */
    .footer {
      background: var(--ink-black); color: var(--paper-cream);
      padding: 70px 0 0; position: relative;
    }
    .footer::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent);
    }
    .footer-grid {
      display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
      gap: 40px; padding-bottom: 50px; border-bottom: 1px solid rgba(248,245,237,0.1);
    }
    .footer-brand { display: flex; flex-direction: column; gap: 18px; }
    .footer-brand .logo-name { color: var(--paper-cream); }
    .footer-brand .logo-tag { color: rgba(248,245,237,0.45); }
    .footer-brand-desc {
      font-size: 13px; line-height: 1.9; color: rgba(248,245,237,0.55); max-width: 300px;
    }
    .footer-social { display: flex; gap: 10px; }
    .footer-social-btn {
      width: 38px; height: 38px; border: 1px solid rgba(248,245,237,0.18);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: rgba(248,245,237,0.65); transition: all 0.3s var(--ease-out);
    }
    .footer-social-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(200,164,100,0.08); }
    .footer-col h4 {
      font-family: 'Noto Serif SC', serif; font-size: 15px; font-weight: 600;
      color: var(--paper-cream); margin-bottom: 20px; letter-spacing: 0.1em;
    }
    .footer-links { display: flex; flex-direction: column; gap: 11px; }
    .footer-links a {
      font-size: 13px; color: rgba(248,245,237,0.55); cursor: pointer; transition: color 0.3s;
    }
    .footer-links a:hover { color: var(--gold); }
    .footer-contact { font-size: 13px; line-height: 2; color: rgba(248,245,237,0.55); }
    .footer-contact-item { display: flex; gap: 8px; margin-bottom: 10px; align-items: flex-start; }
    .footer-contact-item svg { flex-shrink: 0; margin-top: 4px; color: var(--gold); }
    .footer-bottom {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 0; font-size: 12px; color: rgba(248,245,237,0.35);
    }
    .footer-bottom-links { display: flex; gap: 20px; }
    .footer-bottom-links a:hover { color: rgba(248,245,237,0.65); }

    /* ========== 购物车抽屉 ========== */
    .cart-overlay {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(26, 26, 26, 0.5); backdrop-filter: blur(2px);
      animation: fadeIn 0.3s ease;
    }
    .cart-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 90vw;
      z-index: 2001; background: var(--paper-warm);
      display: flex; flex-direction: column;
      box-shadow: var(--shadow-xl);
      animation: slideInRight 0.4s var(--ease-out);
    }
    .cart-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px; border-bottom: 1px solid var(--border-subtle);
    }
    .cart-title {
      font-family: 'Noto Serif SC', serif; font-size: 20px; font-weight: 600;
      display: flex; align-items: center; gap: 10px;
    }
    .cart-count {
      font-size: 13px; color: var(--ink-light); font-weight: 400;
    }
    .close-btn {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s; cursor: pointer; color: var(--ink-medium);
    }
    .close-btn:hover { background: var(--paper-cream); color: var(--ink-black); }

    .cart-items { flex: 1; overflow-y: auto; padding: 8px 24px; }
    .cart-item {
      display: flex; gap: 14px; padding: 16px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .cart-item-img {
      width: 72px; height: 72px; flex-shrink: 0; border-radius: 3px;
      overflow: hidden; background: var(--paper-cream);
    }
    .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name {
      font-family: 'Noto Serif SC', serif; font-size: 14px; font-weight: 600;
      color: var(--ink-black); margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cart-item-spec { font-size: 12px; color: var(--ink-light); margin-bottom: 8px; }
    .cart-item-bottom { display: flex; align-items: center; justify-content: space-between; }
    .cart-item-price {
      font-family: 'Noto Serif SC', serif; font-weight: 600; color: var(--vermilion);
      font-size: 15px;
    }
    .qty-control {
      display: flex; align-items: center; border: 1px solid var(--border-medium);
      border-radius: 2px; overflow: hidden;
    }
    .qty-btn {
      width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
      background: var(--paper-white); color: var(--ink-medium); font-size: 14px;
      transition: background 0.2s;
    }
    .qty-btn:hover { background: var(--paper-cream); color: var(--ink-black); }
    .qty-btn[disabled] { opacity: 0.3; cursor: not-allowed; }
    .qty-num {
      width: 32px; height: 26px; display: flex; align-items: center; justify-content: center;
      background: var(--paper-white); font-size: 13px; font-weight: 500;
      border-left: 1px solid var(--border-subtle); border-right: 1px solid var(--border-subtle);
    }
    .cart-item-remove {
      font-size: 12px; color: var(--ink-light); cursor: pointer;
      padding: 2px 6px; transition: color 0.2s;
    }
    .cart-item-remove:hover { color: var(--vermilion); }

    .cart-empty {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; color: var(--ink-light); padding: 40px; text-align: center;
    }
    .cart-empty-icon { font-size: 48px; opacity: 0.3; }

    .cart-footer {
      padding: 24px; border-top: 1px solid var(--border-subtle);
      background: var(--paper-white);
    }
    .cart-total {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 16px;
    }
    .cart-total-label { font-size: 14px; color: var(--ink-medium); }
    .cart-total-price {
      font-family: 'Noto Serif SC', serif; font-size: 26px; font-weight: 700;
      color: var(--vermilion);
    }

    /* ========== 通用弹窗 ========== */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 3000;
      background: rgba(26, 26, 26, 0.6); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      animation: fadeIn 0.3s ease;
    }
    .modal {
      background: var(--paper-warm); border-radius: 6px;
      max-width: 900px; width: 100%;
      max-height: 90vh; overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: var(--shadow-xl);
      animation: scaleIn 0.35s var(--ease-out);
    }
    .modal-sm { max-width: 440px; }
    .modal-md { max-width: 600px; }
    .modal-lg { max-width: 900px; }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px; border-bottom: 1px solid var(--border-subtle);
    }
    .modal-title {
      font-family: 'Noto Serif SC', serif; font-size: 18px; font-weight: 600;
    }
    .modal-body { padding: 28px 24px; overflow-y: auto; flex: 1; }
    .modal-footer {
      padding: 18px 24px; border-top: 1px solid var(--border-subtle);
      display: flex; gap: 12px; justify-content: flex-end;
      background: var(--paper-white);
    }

    /* ========== 商品详情 ========== */
    .product-detail {
      display: grid; grid-template-columns: 1fr 1fr; gap: 32px;
    }
    .product-detail-img {
      aspect-ratio: 1 / 1; border-radius: 4px; overflow: hidden;
      background: var(--paper-cream);
    }
    .product-detail-img img { width: 100%; height: 100%; object-fit: cover; }
    .product-detail-info { display: flex; flex-direction: column; }
    .detail-cat { font-size: 12px; color: var(--ziyun-main); letter-spacing: 0.15em; margin-bottom: 10px; }
    .detail-name {
      font-family: 'Noto Serif SC', serif; font-size: 26px; font-weight: 700;
      color: var(--ink-black); margin-bottom: 12px; line-height: 1.4;
    }
    .detail-price {
      padding: 18px 20px; background: var(--ziyun-50);
      border-radius: 3px; margin-bottom: 20px;
      display: flex; align-items: baseline; gap: 12px;
    }
    .detail-price-label { font-size: 13px; color: var(--ink-light); }
    .detail-price-num {
      font-family: 'Noto Serif SC', serif; font-size: 32px; font-weight: 700;
      color: var(--vermilion);
    }
    .detail-section { margin-bottom: 20px; }
    .detail-section-label {
      font-size: 13px; color: var(--ink-medium); margin-bottom: 10px; font-weight: 500;
    }
    .spec-options { display: flex; flex-wrap: wrap; gap: 8px; }
    .spec-option {
      padding: 8px 18px; font-size: 13px;
      border: 1px solid var(--border-medium); border-radius: 2px;
      cursor: pointer; transition: all 0.25s;
      background: var(--paper-white); color: var(--ink-medium);
    }
    .spec-option:hover { border-color: var(--ziyun-light); color: var(--ziyun-main); }
    .spec-option.active {
      border-color: var(--ziyun-main); background: var(--ziyun-50);
      color: var(--ziyun-deep); font-weight: 500;
    }
    .detail-stock {
      font-size: 13px; color: var(--ink-light);
      display: flex; align-items: center; gap: 8px;
    }
    .detail-stock .in-stock { color: var(--bamboo); }
    .detail-desc {
      margin-top: 16px; padding-top: 20px; border-top: 1px solid var(--border-subtle);
      font-size: 14px; color: var(--ink-medium); line-height: 1.9;
    }
    .detail-desc h5 {
      font-size: 14px; margin-bottom: 10px; color: var(--ink-black);
    }
    .detail-actions {
      display: flex; gap: 12px; margin-top: auto; padding-top: 20px;
    }
    .detail-qty {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    }
    .detail-qty-label { font-size: 13px; color: var(--ink-medium); }

    /* ========== 表单 ========== */
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block; font-size: 13px; font-weight: 500;
      color: var(--ink-medium); margin-bottom: 8px;
    }
    .form-label .required { color: var(--vermilion); margin-right: 2px; }
    .form-input, .form-textarea, .form-select {
      width: 100%; padding: 11px 14px;
      font-size: 14px; font-family: inherit;
      border: 1px solid var(--border-medium); border-radius: 3px;
      background: var(--paper-white); color: var(--ink-black);
      transition: border-color 0.25s, box-shadow 0.25s;
      outline: none;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--ziyun-main);
      box-shadow: 0 0 0 3px rgba(107, 78, 145, 0.12);
    }
    .form-textarea { resize: vertical; min-height: 72px; line-height: 1.6; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-error {
      font-size: 12px; color: var(--vermilion); margin-top: 6px;
      animation: fadeIn 0.2s;
    }
    .form-success {
      padding: 12px 14px; background: rgba(61, 92, 66, 0.08);
      border: 1px solid rgba(61, 92, 66, 0.2); border-radius: 3px;
      color: var(--bamboo); font-size: 13px; margin-bottom: 16px;
    }

    /* ========== 订单结算 ========== */
    .order-products {
      max-height: 200px; overflow-y: auto; margin-bottom: 20px;
      padding: 12px; background: var(--paper-white);
      border: 1px solid var(--border-subtle); border-radius: 3px;
    }
    .order-product {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 0; border-bottom: 1px dashed var(--border-subtle);
    }
    .order-product:last-child { border-bottom: none; }
    .order-product-img {
      width: 48px; height: 48px; border-radius: 2px; overflow: hidden; flex-shrink: 0;
    }
    .order-product-img img { width: 100%; height: 100%; object-fit: cover; }
    .order-product-info { flex: 1; min-width: 0; }
    .order-product-name {
      font-size: 13px; font-weight: 500; color: var(--ink-black);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .order-product-spec { font-size: 12px; color: var(--ink-light); }
    .order-product-price {
      font-size: 14px; font-weight: 600; color: var(--vermilion);
      font-family: 'Noto Serif SC', serif;
    }
    .order-summary {
      padding: 16px 20px; background: var(--ziyun-50);
      border-radius: 3px; margin-bottom: 20px;
    }
    .order-summary-row {
      display: flex; justify-content: space-between;
      font-size: 13px; color: var(--ink-medium); margin-bottom: 8px;
    }
    .order-summary-row.total {
      font-size: 16px; font-weight: 600; color: var(--ink-black);
      padding-top: 10px; margin-top: 10px; border-top: 1px solid var(--border-subtle);
    }
    .order-summary-row.total .price {
      font-family: 'Noto Serif SC', serif; font-size: 24px; color: var(--vermilion);
    }

    .pay-methods { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .pay-method {
      padding: 16px; border: 2px solid var(--border-subtle);
      border-radius: 4px; cursor: pointer; transition: all 0.25s;
      display: flex; align-items: center; gap: 12px;
      background: var(--paper-white);
    }
    .pay-method:hover { border-color: var(--ziyun-light); }
    .pay-method.active {
      border-color: var(--ziyun-main); background: var(--ziyun-50);
    }
    .pay-icon {
      width: 36px; height: 36px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: white;
    }
    .pay-icon.alipay { background: #1677ff; }
    .pay-icon.wechat { background: #07c160; }
    .pay-icon.bankcard { background: linear-gradient(135deg, var(--ziyun-deep), var(--ziyun-main)); font-size: 14px; }
    .pay-name { font-size: 14px; font-weight: 500; color: var(--ink-black); }

    /* ========== 用户下拉菜单 ========== */
    .nav-user-wrapper { position: relative; }
    .user-dropdown {
      position: absolute; top: calc(100% + 8px); right: 0; min-width: 180px;
      background: var(--paper-white); border-radius: 4px;
      box-shadow: var(--shadow-lg); border: 1px solid var(--border-subtle);
      overflow: hidden; z-index: 1001;
      animation: scaleIn 0.25s var(--ease-out);
      transform-origin: top right;
    }
    .user-dropdown-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; font-size: 13px; color: var(--ink-medium);
      cursor: pointer; transition: all 0.2s; border-bottom: 1px solid var(--border-subtle);
    }
    .user-dropdown-item:last-child { border-bottom: none; }
    .user-dropdown-item:hover { background: var(--ziyun-50); color: var(--ziyun-main); }
    .user-dropdown-item.logout { color: var(--vermilion); }
    .user-dropdown-item.logout:hover { background: rgba(156,42,40,0.06); color: var(--vermilion); }

    /* ========== 地址管理 ========== */
    .address-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; max-height: 360px; overflow-y: auto; }
    .address-card {
      padding: 16px; background: var(--paper-white); border: 1px solid var(--border-subtle);
      border-radius: 4px; transition: all 0.3s var(--ease-out); cursor: pointer; position: relative;
    }
    .address-card:hover { border-color: var(--ziyun-light); }
    .address-card.selected { border-color: var(--ziyun-main); background: var(--ziyun-50); box-shadow: 0 0 0 2px rgba(107,78,145,0.08); }
    .address-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .address-name { font-size: 15px; font-weight: 600; color: var(--ink-black); }
    .address-phone { font-size: 13px; color: var(--ink-medium); }
    .address-default-tag {
      padding: 2px 8px; font-size: 11px; background: var(--ziyun-main); color: var(--paper-cream);
      border-radius: 2px; margin-left: auto; letter-spacing: 0.05em;
    }
    .address-detail { font-size: 13px; color: var(--ink-medium); line-height: 1.7; margin-bottom: 10px; }
    .address-actions { display: flex; gap: 12px; padding-top: 10px; border-top: 1px dashed var(--border-subtle); }
    .address-action-btn {
      font-size: 12px; color: var(--ink-light); cursor: pointer; transition: color 0.2s;
      display: flex; align-items: center; gap: 4px;
    }
    .address-action-btn:hover { color: var(--ziyun-main); }
    .address-action-btn.danger:hover { color: var(--vermilion); }
    .address-add-btn {
      padding: 16px; border: 1px dashed var(--border-medium); border-radius: 4px;
      text-align: center; color: var(--ink-light); cursor: pointer; transition: all 0.3s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 13px; background: var(--paper-white);
    }
    .address-add-btn:hover { border-color: var(--ziyun-main); color: var(--ziyun-main); background: var(--ziyun-50); }
    .address-empty { text-align: center; padding: 40px 20px; color: var(--ink-light); font-size: 14px; }
    .address-form-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .address-form-tab {
      flex: 1; padding: 10px; text-align: center; font-size: 13px;
      border-bottom: 2px solid transparent; cursor: pointer; color: var(--ink-light);
      transition: all 0.25s;
    }
    .address-form-tab.active { color: var(--ziyun-main); border-bottom-color: var(--ziyun-main); font-weight: 500; }

    /* ========== 收藏按钮 ========== */
    .fav-btn {
      position: absolute; top: 12px; right: 12px; z-index: 3;
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-light); cursor: pointer; transition: all 0.25s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .fav-btn:hover { transform: scale(1.1); color: var(--vermilion); }
    .fav-btn.active { color: var(--vermilion); }
    .fav-btn svg { stroke-width: 2; }
    .fav-btn.active svg { fill: currentColor; }

    /* ========== 会员中心 ========== */
    .member-header {
      background: linear-gradient(135deg, var(--ziyun-deep) 0%, var(--ziyun-main) 50%, var(--gold-dark) 130%);
      border-radius: 6px; padding: 24px; color: var(--paper-cream);
      margin-bottom: 20px; position: relative; overflow: hidden;
    }
    .member-header::before {
      content: ''; position: absolute; top: -60px; right: -40px;
      width: 180px; height: 180px; border-radius: 50%;
      background: radial-gradient(circle, rgba(200,164,100,0.25), transparent 70%);
    }
    .member-level-row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; position: relative; }
    .member-avatar {
      width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 700;
      color: var(--ink-black); border: 2px solid rgba(248,245,237,0.4);
    }
    .member-level-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; background: rgba(200,164,100,0.3);
      border: 1px solid var(--gold); border-radius: 20px;
      font-size: 12px; color: var(--gold-light);
      letter-spacing: 0.1em; font-weight: 500;
    }
    .member-name { font-size: 18px; font-weight: 600; margin-bottom: 2px; font-family: 'Noto Serif SC', serif; }
    .member-points-row {
      display: flex; gap: 32px; position: relative;
      padding-top: 14px; border-top: 1px solid rgba(248,245,237,0.2);
    }
    .member-points-item { flex: 1; }
    .member-points-num { font-size: 22px; font-weight: 700; font-family: 'Noto Serif SC', serif; color: var(--gold-light); }
    .member-points-label { font-size: 12px; opacity: 0.7; margin-top: 2px; }
    .member-progress { margin-top: 14px; position: relative; }
    .member-progress-bar {
      height: 6px; background: rgba(248,245,237,0.2); border-radius: 3px; overflow: hidden;
    }
    .member-progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold-light));
      border-radius: 3px;
    }
    .member-progress-text { display: flex; justify-content: space-between; font-size: 11px; opacity: 0.7; margin-top: 6px; }

    .member-levels-grid {
      display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin: 12px 0 24px;
    }
    .member-level-card {
      padding: 28px 10px 16px; border: 1px solid var(--border-subtle);
      border-radius: 4px; text-align: center; background: var(--paper-white);
      transition: all 0.3s; position: relative;
    }
    .member-level-card:hover { border-color: var(--ziyun-light); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .member-level-card.current { border-color: var(--gold); background: linear-gradient(180deg, rgba(200,164,100,0.08), transparent); }
    .member-level-card.current::before {
      content: '当前等级'; position: absolute; top: -1px; left: 50%; transform: translateX(-50%);
      padding: 2px 10px; font-size: 10px; background: var(--gold); color: var(--ink-black);
      border-radius: 0 0 3px 3px; letter-spacing: 0.1em; white-space: nowrap;
    }
    .level-icon {
      width: 40px; height: 40px; margin: 0 auto 10px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Serif SC', serif; font-size: 16px; font-weight: 700;
    }
    .level-normal { background: #f0ece4; color: var(--ink-medium); }
    .level-silver { background: linear-gradient(135deg, #c0c0c0, #e8e8e8); color: #555; }
    .level-gold { background: linear-gradient(135deg, var(--gold-dark), var(--gold-light)); color: var(--ink-black); }
    .level-diamond { background: linear-gradient(135deg, #87ceeb, #b8e0f0, #87ceeb); color: #1a5c7a; }
    .level-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; font-family: 'Noto Serif SC', serif; }
    .level-condition { font-size: 11px; color: var(--ink-light); }

    .member-benefits h4, .member-points-rules h4 {
      font-size: 15px; font-family: 'Noto Serif SC', serif; margin-bottom: 12px;
    }
    .benefit-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    .benefit-item {
      padding: 12px; background: var(--paper-cream); border-radius: 4px;
      border-left: 3px solid var(--ziyun-main); font-size: 13px;
    }
    .benefit-item strong { display: block; font-size: 13px; margin-bottom: 2px; color: var(--ink-black); }
    .benefit-item span { font-size: 12px; color: var(--ink-light); line-height: 1.5; }
    .sign-in-btn {
      padding: 8px 20px; font-size: 13px; border-radius: 20px;
      background: var(--gold); color: var(--ink-black); border: none; cursor: pointer;
      transition: all 0.25s; font-weight: 500;
    }
    .sign-in-btn:hover { background: var(--gold-light); transform: translateY(-1px); }
    .sign-in-btn.signed { background: var(--border-medium); color: var(--ink-light); cursor: default; }
    .sign-in-btn:disabled { opacity: .65; cursor: default; transform: none; }
    .member-points-rules { margin-top: 20px; font-size: 13px; line-height: 1.8; }
    .member-points-rules ul { padding-left: 20px; }
    @media (max-width: 640px) {
      .member-levels-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .member-level-card p { font-size: 13px; line-height: 1.6; }
      .member-level-row { flex-wrap: wrap; gap: 12px; }
      .member-level-row .sign-in-btn { flex-basis: 100%; }
      .member-header { padding: 20px; }
    }

    /* ========== 手风琴 FAQ ========== */
    .accordion { display: flex; flex-direction: column; gap: 8px; }
    .accordion-item {
      border: 1px solid var(--border-subtle); border-radius: 4px;
      background: var(--paper-white); overflow: hidden;
      transition: all 0.3s;
    }
    .accordion-item.open { border-color: var(--ziyun-light); }
    .accordion-header {
      padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; font-weight: 500; color: var(--ink-black);
      transition: all 0.2s; background: var(--paper-cream);
    }
    .accordion-item.open .accordion-header { color: var(--ziyun-main); background: var(--ziyun-50); }
    .accordion-header:hover { color: var(--ziyun-main); }
    .accordion-icon {
      transition: transform 0.3s; color: var(--ink-light);
    }
    .accordion-item.open .accordion-icon { transform: rotate(180deg); color: var(--ziyun-main); }
    .accordion-body {
      padding: 0 18px; max-height: 0; overflow: hidden;
      transition: all 0.3s ease; font-size: 13px; color: var(--ink-medium); line-height: 1.8;
    }
    .accordion-item.open .accordion-body { padding: 14px 18px; max-height: 300px; border-top: 1px solid var(--border-subtle); }

    /* ========== 匠人访谈 ========== */
    .artisan-section { padding: 90px 0; background: var(--paper-warm); }
    .artisan-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .cat-grid.editorial-items-two,.artisan-grid.editorial-items-two,.culture-grid.editorial-items-two,.story-grid.editorial-items-two { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .cat-grid.editorial-items-three,.artisan-grid.editorial-items-three,.culture-grid.editorial-items-three,.story-grid.editorial-items-three { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .cat-grid.editorial-items-four,.artisan-grid.editorial-items-four,.culture-grid.editorial-items-four,.story-grid.editorial-items-four { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .cat-grid.editorial-items-list,.artisan-grid.editorial-items-list,.culture-grid.editorial-items-list,.story-grid.editorial-items-list { grid-template-columns: minmax(0,1fr); }
    .artisan-card {
      background: var(--paper-white); border-radius: 4px; overflow: hidden;
      box-shadow: var(--shadow-sm); cursor: pointer; transition: all 0.4s var(--ease-out);
    }
    .artisan-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
    .artisan-avatar {
      height: 180px; background: linear-gradient(135deg, var(--ziyun-deep), var(--ziyun-main));
      display: flex; align-items: center; justify-content: center; position: relative;
      overflow: hidden;
    }
    .artisan-avatar::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 30% 30%, rgba(200,164,100,0.3), transparent 60%);
    }
    .artisan-avatar-icon {
      font-family: 'Ma Shan Zheng', cursive; font-size: 80px; color: var(--gold-light);
      position: relative; z-index: 1; opacity: 0.8;
    }
    .artisan-info { padding: 20px; }
    .artisan-craft { font-size: 12px; color: var(--gold-dark); letter-spacing: 0.2em; margin-bottom: 6px; }
    .artisan-name { font-size: 18px; font-weight: 600; font-family: 'Noto Serif SC, serif'; margin-bottom: 6px; color: var(--ink-black); }
    .artisan-years { font-size: 12px; color: var(--ink-light); margin-bottom: 10px; }
    .artisan-excerpt { font-size: 13px; color: var(--ink-medium); line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .artisan-detail-img {
      width: 100%; height: 200px; object-fit: cover; border-radius: 4px; margin-bottom: 20px;
    }
    .artisan-detail-title { font-family: 'Noto Serif SC', serif; font-size: 22px; margin-bottom: 6px; }
    .artisan-detail-meta { font-size: 13px; color: var(--ink-light); margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border-subtle); }
    .artisan-detail-body { font-size: 14px; color: var(--ink-medium); line-height: 1.9; }
    .artisan-detail-body p { margin-bottom: 14px; }

    /* ========== 个人信息编辑 ========== */
    .profile-avatar-select { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .avatar-option {
      width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Serif SC', serif; font-size: 18px; font-weight: 600;
      border: 3px solid transparent; transition: all 0.25s; color: var(--paper-cream);
    }
    .avatar-option:hover { transform: scale(1.1); }
    .avatar-option.selected { border-color: var(--gold); box-shadow: 0 0 0 2px var(--ziyun-50); }
    .avatar-0 { background: linear-gradient(135deg, var(--ziyun-main), var(--ziyun-deep)); }
    .avatar-1 { background: linear-gradient(135deg, var(--gold-dark), var(--gold-light)); color: var(--ink-black); }
    .avatar-2 { background: linear-gradient(135deg, #8b4513, #cd853f); }
    .avatar-3 { background: linear-gradient(135deg, #2e7d32, #66bb6a); }
    .avatar-4 { background: linear-gradient(135deg, #c62828, #ef5350); }
    .avatar-5 { background: linear-gradient(135deg, #1565c0, #42a5f5); }

    /* ========== 反馈表单 ========== */
    .feedback-success {
      text-align: center; padding: 40px 20px;
    }
    .feedback-success-icon {
      width: 64px; height: 64px; margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--bamboo), #5aab6e);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: white; animation: scaleIn 0.5s var(--ease-spring);
    }

    /* ========== 收藏列表 ========== */
    .favorites-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-height: 60vh; overflow-y: auto; }
    .favorite-item {
      background: var(--paper-white); border: 1px solid var(--border-subtle);
      border-radius: 4px; overflow: hidden; display: flex; flex-direction: column;
    }
    .favorite-item-img {
      height: 120px; overflow: hidden; position: relative;
    }
    .favorite-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .favorite-item-info { padding: 10px 12px; flex: 1; display: flex; flex-direction: column; }
    .favorite-item-name {
      font-size: 13px; font-weight: 500; color: var(--ink-black);
      margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    }
    .favorite-item-price { font-size: 15px; color: var(--vermilion); font-family: 'Noto Serif SC, serif'; font-weight: 600; margin-top: auto; }
    .favorite-item-actions {
      display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border-subtle);
    }
    .favorite-item-actions button { flex: 1; }
    .favorites-empty { text-align: center; padding: 40px 20px; color: var(--ink-light); }

    /* ========== 说明类弹窗内容 ========== */
    .help-content h4 { font-size: 16px; font-family: 'Noto Serif SC', serif; margin-bottom: 14px; color: var(--ziyun-main); }
    .help-content h5 { font-size: 14px; font-weight: 600; margin: 16px 0 8px; color: var(--ink-black); }
    .help-content p { font-size: 13px; color: var(--ink-medium); line-height: 1.8; margin-bottom: 10px; }
    .help-content ul, .help-content ol { font-size: 13px; color: var(--ink-medium); line-height: 1.8; padding-left: 20px; margin-bottom: 12px; }
    .help-content li { margin-bottom: 4px; }

    .steps-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
    .step-item { display: flex; gap: 14px; align-items: flex-start; }
    .step-number {
      width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%;
      background: linear-gradient(135deg, var(--ziyun-main), var(--ziyun-deep));
      color: var(--paper-cream); font-family: 'Noto Serif SC', serif; font-weight: 700;
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .step-content h5 { margin: 4px 0 4px; font-size: 14px; }
    .step-content p { margin: 0; font-size: 13px; color: var(--ink-light); line-height: 1.6; }

    .pay-methods-intro { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
    .pay-intro-item {
      padding: 16px; border: 1px solid var(--border-subtle); border-radius: 4px;
      display: flex; gap: 14px; align-items: flex-start; background: var(--paper-white);
    }
    .pay-intro-icon {
      width: 40px; height: 40px; border-radius: 4px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: white;
    }
    .pay-intro-item h5 { margin: 0 0 4px; font-size: 14px; }
    .pay-intro-item p { margin: 0; font-size: 12px; color: var(--ink-light); line-height: 1.6; }

    .info-tip {
      padding: 12px 16px; background: var(--ziyun-50);
      border-left: 3px solid var(--ziyun-main); border-radius: 0 4px 4px 0;
      font-size: 13px; color: var(--ink-medium); line-height: 1.7; margin-bottom: 14px;
    }
    .info-tip.warn { background: rgba(200,120,40,0.08); border-left-color: #c87828; }
    .info-tip.success { background: rgba(93, 156, 89, 0.08); border-left-color: var(--bamboo); }

    /* ========== 个人中心 Tab 弹窗 ========== */
    .profile-tabs {
      display: flex; gap: 0; margin: -28px -24px 20px;
      padding: 0 24px; border-bottom: 1px solid var(--border-subtle);
      background: var(--paper-white); border-radius: 6px 6px 0 0;
    }
    .profile-tab {

    '💡 温馨提示：付款结果以平台核实或商家核账为准。优惠以结算页为准，可在「我的订单」中查看状态和发货单号。': '💡 Please note: payment is confirmed only after platform or merchant verification. Final offers appear at checkout, and order status and tracking are available under My Orders.',

    '普通支付宝 / 普通微信': 'Personal Alipay / Personal WeChat Pay',
    '扫描收款码，或保存图片后在支付应用内识别并转账。付款后填写账单流水号并提交核实；商家核对实际到账后，页面自动显示支付成功，订单进入待发货。买家点击“我已付款”本身不代表到账。': 'Scan the QR code, or save it and identify it in the payment app. After paying, submit the transaction reference for review. The order moves to Awaiting Shipment only after the merchant verifies the funds; selecting I Have Paid does not itself confirm receipt.',
    '商户支付宝 / 商户微信': 'Merchant Alipay / Merchant WeChat Pay',
    '仅开通并配置完成的商户渠道可用。付款后由服务端核验平台通知或主动查单，自动更新支付结果。': 'Only fully configured merchant channels are available. The server verifies the provider notification or checks the transaction before updating payment status.',
    '银行卡与订单完成': 'Bank Cards and Order Completion',
    '银行卡可在官方收银台选择，本站不收集卡号、密码或CVV。付款成功不等于已收货：订单发货后，由买家确认收货完成订单。': 'Bank cards may be selected only at the official checkout; this site does not collect card numbers, passwords, or CVVs. A paid order is not complete until it is shipped and the buyer confirms delivery.',
    '配送范围、时效、运费及承运方式尚待经营方审核发布。实际运费以结算页服务端报价为准，公开运营前必须在后台补齐配送政策。': 'Shipping coverage, delivery times, fees, and carriers are pending merchant review. The server quote shown at checkout is final, and a complete shipping policy must be published before launch.',

    '💡 建议您优先在「常见问题」中查找答案，多数问题可即时解决。如未找到答案，再联系客服。': '💡 Start with the FAQ for quick answers to common questions. If you still need help, contact Customer Care.',
    '常见问题 FAQ': 'Frequently Asked Questions',
    '支付结果如何确认？': 'How is payment confirmed?',
    '商户支付以支付平台验签通知或服务端查单为准；普通收款码由商家核对真实到账。页面提示提交成功不等同于已经到账。': 'Merchant payments are confirmed by a verified provider notification or server-side transaction check. Personal QR transfers require merchant verification; a successful submission does not mean funds have arrived.',
    '如何申请售后？': 'How do I request after-sales service?',
    '已核实付款的订单可在“我的订单”中提交售后申请，处理状态会显示在订单中；具体条件以经营方已发布的售后政策为准。': 'For a verified paid order, submit a request under My Orders and follow its status there. Eligibility is governed by the merchant\'s published after-sales policy.',
    '毛笔如何保养？': 'How should I care for a brush?',
    '①新笔开笔：用温水将笔锋轻轻捻开，浸泡5-10分钟至笔毫完全散开；②使用后清洗：每次使用后用清水洗净余墨，切勿用肥皂等清洁剂；③悬挂晾干：洗净后挤干水分，悬挂于笔挂上自然晾干，避免阳光直射；④长期存放：可放入樟脑丸防虫蛀，保持干燥通风。': '① Opening: gently loosen a new tip in warm water for 5–10 minutes. ② Cleaning: rinse out all ink with clean water and avoid soap. ③ Drying: remove excess water and hang the brush away from direct sunlight. ④ Storage: keep it dry, ventilated, and protected from insects.',
    '宣纸如何保存？': 'How should I store Xuan paper?',
    '①平放或卷筒存放，避免折压产生折痕；②存放在阴凉干燥通风处，避免阳光直射和潮湿环境；③宣纸有"越放越好用"的特点，妥善保存可提升纸张品质；④南方潮湿地区可放干燥剂防霉，北方干燥地区注意防裂。': '① Store sheets flat or rolled to prevent creases. ② Keep them in a cool, dry, ventilated place away from sunlight and moisture. ③ Proper aging can improve Xuan paper. ④ Use desiccant in humid climates and guard against cracking in very dry conditions.',
    '砚台如何开砚？': 'How do I prepare a new inkstone?',
    '新砚使用前需开砚：①用清水将砚台洗净，去除出厂时的蜡质和灰尘；②用废弃墨条或砂纸在砚堂轻轻研磨出细粉（注意不要划伤砚台）；③用清水反复冲洗干净；④阴干后即可使用。平时使用后及时清洗，保持砚台洁净。': 'Before first use: ① rinse away wax and dust; ② gently condition the well with an old ink stick or suitable fine abrasive without scratching it; ③ rinse thoroughly; ④ air-dry in the shade. Clean the inkstone promptly after later use.',
    '墨锭如何研磨？': 'How do I grind an ink stick?',
    '①先在砚池中加入少量清水（温水更佳）；②持墨锭垂直于砚堂，以打圈或8字形方式缓缓研磨；③研磨力度要均匀，速度不宜过快，一般研磨5-10分钟即可使用；④研磨好的墨汁应在当日使用，隔夜墨汁易变质发臭；⑤磨完后将墨锭擦干放回墨匣，避免长期浸泡变软。': '① Add a little clean water to the inkstone. ② Hold the ink stick upright and grind slowly in circles or a figure eight. ③ Keep pressure even for about 5–10 minutes. ④ Use the ink the same day. ⑤ Wipe the stick dry and return it to its case; never leave it soaking.',

    '面对琳琅满目的毛笔，初学者往往不知如何选择。羊毫、狼毫、兼毫各有何特点？大楷、中楷、小楷该怎么挑？本文从毫毛材质、字体适配、使用场景等角度，助你找到第一支称心之笔。': 'Choosing a first brush can feel daunting. This guide explains goat, weasel, and mixed hair, then matches brush size and resilience to script style and everyday use.',
    '先看笔毫材质': 'Start with the Hair', '再按字体大小选笔锋': 'Match the Tip to Your Script Size', '试笔时关注四个细节': 'Four Details to Check',
    '羊毫柔软、蓄墨量大，适合写圆润含蓄的线条，也适合国画渲染；狼毫弹性较强、出锋利落，适合楷书、行书和较细劲的线条；兼毫把软毫与硬毫搭配在一起，弹性与蓄墨较均衡，对初学者最友好。第一次购笔若没有明确书体偏好，可以先从中等弹性的兼毫入手。': 'Goat hair is soft and holds abundant ink, making it suited to rounded lines and painting washes. Weasel hair is springier and produces a crisp point for regular and running scripts. Mixed-hair brushes balance resilience and ink capacity, making them the most forgiving choice for a first brush.',
    '笔锋长度和粗细应与常写的字径匹配。小楷宜选锋短、腰力足的小笔；日常练习五至八厘米的楷书，可选中楷或大楷；写榜书、对联时才需要斗笔。笔并非越大越好，过大的笔难以控制，过小则蓄墨不足、笔画容易干枯。': 'Choose a tip whose length and width match the characters you usually write. Small regular script calls for a short, firm tip; five-to-eight-centimeter practice characters suit a medium or large regular-script brush. Reserve very large brushes for monumental characters and couplets.',
    '观察笔尖能否自然聚拢，蘸水后是否齐整；轻压笔毫，看铺开后能否顺利回锋；转动笔杆检查笔锋是否偏斜；最后感受笔杆粗细、长度是否顺手。新笔使用前用常温清水缓慢发开，避免用热水久泡，也不要把整支笔长期浸在水中。': 'Check that the tip gathers naturally and stays even when wet. Press gently to see whether the hairs recover, rotate the shaft to spot any lean, and make sure the grip feels comfortable. Open a new brush slowly in room-temperature water; never soak it in hot water or leave the whole brush submerged.',
    '宣纸分生宣、熟宣、半生熟三大类，各自有不同的特性和适用场景。生宣写意、熟宣工笔、半生熟兼而有之。了解宣纸的特性，才能让书画创作事半功倍。': 'Xuan paper comes in raw, sized, and semi-sized forms. Raw paper rewards expressive work, sized paper supports fine detail, and semi-sized paper balances the two.',
    '生宣：吸水快，墨色变化丰富': 'Raw Xuan: Fast Absorption and Rich Ink Variation', '熟宣：不易渗化，适合精细刻画': 'Sized Xuan: Controlled Edges for Fine Detail', '半生熟：兼顾控制与墨韵': 'Semi-sized Xuan: Control with Natural Ink Character',
    '生宣没有经过矾制处理，吸水和渗化能力强。落墨后容易形成浓淡、枯湿和自然墨韵，适合写意花鸟、山水以及行草书。初学时可先在边角试墨，控制含水量和行笔速度，避免墨色过度扩散。': 'Raw Xuan is not treated with alum, so it absorbs and diffuses water quickly. It creates natural shifts between dense and pale, wet and dry—ideal for expressive painting, running script, and cursive. Test ink at the edge first to judge water and speed.',
    '熟宣经过胶矾处理，纸面相对紧密，墨和颜色停留在表层，便于反复罩染和细线勾勒，因此常用于工笔画、小楷和界画。熟宣不宜反复折叠或重压，胶矾层受损后容易出现局部漏矾。': 'Sized Xuan is treated with glue and alum, keeping ink and color closer to the surface. It supports repeated glazing and precise lines for gongbi painting and small script. Avoid repeated folding or heavy pressure, which can damage the sized surface.',
    '半生熟的吸水程度介于两者之间，既保留一定渗化效果，又比生宣容易控制，适合初学书法、写意小品和兼工带写。判断纸性时，可滴一小滴清水：迅速扩散的是生宣，基本不扩散的是熟宣，缓慢扩散的通常是半生熟。': 'Semi-sized Xuan absorbs more slowly than raw paper while retaining some natural diffusion. It is a welcoming choice for learners and small expressive works. A drop of water reveals the type: rapid spread means raw, almost no spread means sized, and a slow halo usually means semi-sized.',
    '一方好砚可传家，但保养不当也会损伤石质与发墨性能。日常使用后如何清洗？如何存放？出现划痕、墨垢如何处理？本文详解砚台保养的要点与误区。': 'A fine inkstone can serve generations when cared for well. Learn how to clean, store, and use one without damaging its stone or ink-making qualities.',
    '用后及时清洗': 'Clean Soon After Use', '保持适度湿润，但不要久泡': 'Avoid Extreme Dryness and Long Soaking', '正确研墨与存放': 'Grind and Store with Care',
    '墨汁长时间干结会堵塞砚面细微石理，影响下墨。使用后以清水和柔软海绵轻洗即可，顽固墨垢可先用清水浸润片刻再轻擦。不要使用洗涤剂、硬毛刷或金属工具，以免腐蚀或划伤砚面。': 'Dried ink can clog the stone’s fine texture and reduce ink release. Rinse with clean water and a soft sponge after use; soften stubborn residue with water before wiping gently. Avoid detergents, stiff brushes, and metal tools.',
    '砚台适合置于阴凉、通风、温湿度稳定的环境。天气干燥时可在砚盒内放一小片微湿布，但不要让砚台长期泡水，也不要突然暴晒或靠近暖气。冷热骤变和过度干湿交替都可能引起石材开裂。': 'Keep an inkstone in a cool, ventilated place with stable temperature and humidity. In dry weather, a slightly damp cloth may sit inside the box, but the stone should never remain in water or face sudden heat and sun. Abrupt changes can cause cracking.',
    '研墨时保持墨锭垂直，力度均匀，沿砚堂缓慢打圈，不要斜压猛推。研墨后擦净墨锭底部再收纳，避免墨锭与砚面粘连。长期不用时应彻底清洁、自然阴干，再放入合适的砚盒中，避免与硬物碰撞。': 'Hold the ink stick upright and grind slowly in even circles without leaning or forcing it. Wipe the base before storage so it cannot stick to the stone. For long-term storage, clean and air-dry the inkstone fully, then protect it in a fitted box.',
    '紫云湖品牌源自徽州湖畔百年制笔世家，世代传承文房制作技艺，最早可追溯至清光绪年间的「紫云轩」笔庄。': 'Ziyun Lake traces its roots to a Huizhou brush-making family whose workshop, Ziyun Studio, dates to the late Qing dynasty.',
    '每一件文房器物皆经百余道工序，由非遗匠人纯手工打造。从选料至成品，历时数月乃至数载方得大成。': 'Each scholar’s object passes through scores of hand processes, from careful material selection to months—or years—of patient finishing.',
    '我们坚信文房四宝不仅是工具，更是中华文脉的载体。紫云湖致力于让传统文化在当代焕发新的生命力。': 'The Four Treasures are more than tools: they carry a literary tradition. Ziyun Lake helps that tradition remain useful, beautiful, and alive today.',
    '一支好笔，要经一百二十七道工序。每道工序都慢不得、省不得。做笔一辈子，我最看重的是「四德」——尖、齐、圆、健。': 'A fine brush passes through 127 steps. None can be hurried or skipped. After a lifetime of making brushes, I still judge one by four virtues: a sharp point, even hairs, a full body, and resilient spring.',
    '墨者，黑也；然黑中有万千层次。好墨如好茶，要时间来陈。一方好墨，可传三代人。墨香越陈越醇，墨色越老越润。': 'Ink may be black, but black contains countless tones. Like fine tea, good ink matures with time; one stick can serve three generations, growing mellower and richer as it ages.',
    '宣纸是有灵性的。同样的皮料、同样的工艺，不同的人抄出来的纸就是不一样。纸知道你有没有用心——墨一落纸，便见分晓。': 'Xuan paper has a spirit of its own. Give two people the same fiber and process and their sheets will still differ. The paper knows whether you worked with care—the instant ink touches it, the truth appears.',
    '一方好砚，讲究「石品第一，刀法第二，造型第三」。砚是用来磨墨的，不是摆着看的。发墨快、不伤笔、不吸水，才是一方好砚的根本。': 'For a fine inkstone, stone quality comes first, carving second, and shape third. An inkstone is made to grind ink: it should release ink quickly, protect the brush, and resist absorbing water.',

  let activeLanguage = 'en';
  const LanguageContext = createContext(null);
  const textRecords = new WeakMap();
  const attributeRecords = new WeakMap();

  function translateUiText(source, language = activeLanguage) {
    if (language !== 'en' || source === null || source === undefined) return String(source ?? '');
    const raw = String(source);
    const match = raw.match(/^(\s*)([\s\S]*?)(\s*)$/);
    const value = match ? match[2] : raw;
    if (!value) return raw;
    let translated = EN_TEXT[value];
    if (!translated) {
      const templates = [
        [/^(\d[\d,]*)人阅读$/, '$1 reads'], [/^(\d+)分钟$/, '$1 min'],
        [/^第 (\d+) 页 \/ 共 (\d+) 页$/, 'Page $1 of $2'], [/^第 (\d+) 页 · 共 (\d+) 笔$/, 'Page $1 · $2 orders'],
        [/^搜索结果：找到 (\d+) 件相关商品$/, '$1 matching products'], [/^购物车 \((\d+)\)$/, 'Cart ($1)'],
        [/^\((\d+) 件商品\)$/, '($1 items)'], [/^库存：?(\d+)件$/, 'Stock: $1'], [/^库存 (\d+) 件$/, '$1 in stock'], [/^可购 (\d+) 件$/, '$1 available'],
        [/^从业 (\d+) 年$/, '$1 Years in the Craft'], [/^累计 ¥([\d.]+)$/, 'Spend ¥$1'],
      ];
      const template = templates.find(([pattern]) => pattern.test(value));
      translated = template ? value.replace(template[0], template[1]) : value;
    }
    return (match ? match[1] : '') + translated + (match ? match[3] : '');
  }

  function translateTextNode(node, language) {
    const parent = node.parentElement;
    if (!parent || parent.closest('[data-i18n-skip]') || /^(SCRIPT|STYLE)$/.test(parent.tagName) || !node.nodeValue.trim()) return;
    let record = textRecords.get(node);
    if (!record || node.nodeValue !== record.output) record = { source: node.nodeValue, output: node.nodeValue };
    const output = translateUiText(record.source, language);
    record.output = output; textRecords.set(node, record);
    if (node.nodeValue !== output) node.nodeValue = output;
  }

  function translateAttribute(element, name, language) {
    if (!element.hasAttribute(name) || element.closest('[data-i18n-skip]')) return;
    let records = attributeRecords.get(element);
    if (!records) { records = new Map(); attributeRecords.set(element, records); }
    const current = element.getAttribute(name);
    let record = records.get(name);
    if (!record || current !== record.output) record = { source: current, output: current };
    const output = translateUiText(record.source, language);
    record.output = output; records.set(name, record);
    if (current !== output) element.setAttribute(name, output);
  }

  function translateElement(element, language) {
    if (!element || element.nodeType !== Node.ELEMENT_NODE || element.closest('[data-i18n-skip]')) return;
    ['aria-label', 'title', 'placeholder', 'alt'].forEach(name => translateAttribute(element, name, language));
    element.querySelectorAll('[aria-label], [title], [placeholder], [alt]').forEach(child => ['aria-label', 'title', 'placeholder', 'alt'].forEach(name => translateAttribute(child, name, language)));
    const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
    let node; while ((node = walker.nextNode())) translateTextNode(node, language);
  }

  function LanguageProvider({ children }) {
    const [language, setLanguage] = useState(() => {
      const saved = LS.get(LANGUAGE_KEY, '');
      return saved === 'zh' || saved === 'en' ? saved : 'en';
    });
    useEffect(() => {
      activeLanguage = language;
      LS.set(LANGUAGE_KEY, language);
      updateLocalizedMetadata(language);
      const root = document.getElementById('root');
      if (!root) return;
      translateElement(root, language);
      const observer = new MutationObserver(records => records.forEach(record => {
        if (record.type === 'attributes') translateAttribute(record.target, record.attributeName, language);
        else if (record.type === 'characterData') translateTextNode(record.target, language);
        else record.addedNodes.forEach(node => node.nodeType === Node.TEXT_NODE ? translateTextNode(node, language) : translateElement(node, language));
      }));
      observer.observe(root, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['aria-label', 'title', 'placeholder', 'alt'] });
      return () => observer.disconnect();
    }, [language]);
    const value = useMemo(() => ({ language, setLanguage, toggleLanguage: () => setLanguage(current => current === 'en' ? 'zh' : 'en') }), [language]);
    return React.createElement(LanguageContext.Provider, { value: value,}, children);
  }

  const useLanguage = () => useContext(LanguageContext);

  function EditorialBody({section}){

    return React.createElement('div', { className: "editorial-body", 'data-i18n-skip': true,}, editorialParagraphs(body).map((paragraph,index)=>React.createElement('p', { key: index,}, paragraph)));
